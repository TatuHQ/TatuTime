# TucanoTime — recreate-safe, hardened deployment (#94).
#
# Everything the app *stores* lives on the named volume: users, entries,
# invoices, the credential vault (secrets.bin + its auto-generated vault.key),
# config.json and scheduler state. Restarting or upgrading
# (`docker compose pull && up -d`) loses nothing, with **zero required
# environment setup**:
#
#   * sessions — the signing key is auto-generated on first boot and kept at
#     <volume>/session.key (0600), so logins survive restarts. Override with a
#     mounted TUCANO_SESSION_SECRET_FILE (see "secrets" below);
#   * settings — resolved env > /data/config.json > default. Make runtime
#     knobs survive recreation via `PUT /api/admin/config` (Settings tab in
#     the GUI) or by editing config.json on the volume. `vault_enabled` is the
#     one read-only knob there (422): the vault card in Settings → Security
#     owns it;
#   * vault key — a 32-character key (192 bits of entropy, 0600) is generated
#     automatically at <volume>/vault.key on first boot, so no setup is needed.
#     The `secrets:` recipe below is only for an external override; if
#     /data/secrets.bin exists but no key can open it, the app REFUSES to
#     start (a loud operator error, never a silent downgrade).
#
# Hardening applied to **every** service: the container root filesystem is
# read-only (only /data and the /tmp tmpfs are writable), every capability is
# dropped, privilege escalation is blocked, an init reaps zombies, and the
# published port binds to loopback unless TUCANO_HOST_ADDR says otherwise.
# The server was verified to run under exactly this set.
#
# The default stack also sends email: the `mailpit` service below is a
# **development/QA inbox** that *captures* mail for inspection at
# http://127.0.0.1:8025 and never forwards it. `docker compose up -d` therefore
# really delivers (into that inbox); production must point
# TUCANO_SMTP_HOST/TUCANO_SMTP_PORT — or the vault's `smtp.*` entries, which
# win — at a real relay. A bare `docker run` carries none of this wiring, so
# the binary keeps its own default there: no SMTP host, email stays "not
# configured" and only logs the message.
services:
  tucanotime:
    build: .
    image: tucanotime:latest
    restart: unless-stopped
    # Loopback by default (S4): a timesheet server with a first-run bootstrap
    # endpoint should not appear on every interface because of a side effect.
    # For LAN use set TUCANO_HOST_ADDR=0.0.0.0 (and see TUCANO_SECURE_COOKIES).
    ports:
      - "${TUCANO_HOST_ADDR:-127.0.0.1}:${TUCANO_HOST_PORT:-8080}:8080"
    volumes:
      - tucanotime-data:/data
    # Start only once the relay's HTTP healthcheck passes, so a fresh
    # `docker compose up -d` cannot race Mailpit's SMTP listener.
    depends_on:
      mailpit:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    user: "10001:10001"
    stop_grace_period: 30s
    environment:
      # All optional. Empty/unset means defaults (sessions auto-persist).
      TUCANO_ENV: ${TUCANO_ENV:-production}
      # Plain HTTP on a LAN (no TLS proxy)? Set TUCANO_SECURE_COOKIES=0 —
      # browsers drop `Secure` cookies on non-localhost origins, so the
      # default (secure in production) would break login over http://IP.
      # This flag is independent of the strong-secret enforcement (review A5).
      TUCANO_SECURE_COOKIES: ${TUCANO_SECURE_COOKIES:-}
      # Default sender: the Mailpit sidecar captures every message for
      # inspection (UI/API on http://127.0.0.1:8025). Mailpit is a development
      # and QA inbox, NOT a relay — it never forwards mail. For production set
      # a real relay instead, through the vault (Settings → Email, which wins
      # over env) or these two variables. Without them — a bare `docker run`,
      # for example — the binary's own default applies and email stays
      # "not configured" (messages are logged, not sent).
      TUCANO_SMTP_HOST: mailpit
      TUCANO_SMTP_PORT: "1025"
      # Optional file-based secrets, never plaintext env. The session and vault
      # keys are otherwise auto-generated on the data volume; enable the
      # `secrets:` blocks at the bottom of this file and uncomment these to
      # override them from outside /data:
      # TUCANO_SESSION_SECRET_FILE: /run/secrets/tucano_session_secret
      # TUCANO_SECRET_KEY_FILE: /run/secrets/tucano_vault_key
      # labels are ignored by docker but document the backup recipe:
    labels:
      com.tucanotime.backup: >-
        docker compose run --rm tucanotime-cli --backup /backups/manual.tar.gz

  # Mailpit — the default stack's SMTP sink. It **captures** messages so they
  # can be read at http://127.0.0.1:8025 (web UI and `GET /api/v1/messages`);
  # it is not a relay and never forwards a message anywhere.
  #
  #   * the app reaches it over the compose network at `mailpit:1025`; no SMTP
  #     port is published to the host, so nothing outside this network can use
  #     it as a relay. Only the inbox UI is published, on loopback;
  #   * the image is pinned to an exact release so a rebuild is reproducible;
  #   * the database lives on a /data tmpfs (in-memory SQLite), so captured
  #     mail lasts for the container's lifetime and `docker compose down` wipes
  #     it — an inbox, not a mailbox;
  #   * production uses a real relay: point TUCANO_SMTP_HOST/TUCANO_SMTP_PORT
  #     (vault or env) at it, or remove this service.
  mailpit:
    image: axllent/mailpit:v1.31.6
    restart: unless-stopped
    # Loopback only: the captured mail is unauthenticated by design.
    ports:
      - "127.0.0.1:8025:8025"
    read_only: true
    tmpfs:
      - /tmp
      # message store: in-memory SQLite, writable by the non-root user
      - /data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    user: "10001:10001"
    environment:
      MP_DATABASE: /data/mailpit.db
    # Probe the HTTP endpoint the UI/API serve, not the SMTP port.
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8025/livez" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    stop_grace_period: 10s

  # One-shot CLI on the same image for backups/restores against the volume:
  #   docker compose run --rm tucanotime-cli --backup /backups/today.tar.gz
  #   docker compose stop tucanotime
  #   docker compose run --rm tucanotime-cli --restore /backups/today.tar.gz
  #   docker compose up -d tucanotime
  # (--restore refuses a non-empty data dir unless you pass --force)
  tucanotime-cli:
    image: tucanotime:latest
    profiles: [ "cli" ]
    entrypoint: [ "/usr/local/bin/tucano-time" ]
    volumes:
      - tucanotime-data:/data
      - ${TUCANO_BACKUP_DIR:-./backups}:/backups
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    user: "10001:10001"
    stop_grace_period: 30s
    environment:
      TUCANO_ENV: ${TUCANO_ENV:-production}
      # Same optional file-based secrets as the server, so a restore/backup run
      # sees the same external vault key (see the `secrets:` block below). With
      # no override, the server's generated <volume>/vault.key is used.
      # TUCANO_SECRET_KEY_FILE: /run/secrets/tucano_vault_key

      # External-override recipe (the app generates both keys on the volume by
      # default, so this is only needed to keep them outside /data):
      #
      #   mkdir -p secrets                             # ignored by git and Docker
      #   openssl rand -base64 24 > secrets/vault.key  # 32 ASCII chars, 192 bits
      #   openssl rand -hex 32 > secrets/session.key
      #   chmod 600 secrets/*.key
      #
      # `./secrets/` is listed in both .gitignore and .dockerignore, so this
      # recipe can never stage key material in git or bake it into the image.
      # To keep it outside the checkout instead, point TUCANO_SECRETS_DIR at a
      # directory outside the repository.
      #
      # Setting either *_FILE variable makes the vault operator-managed: the
      # Settings key actions are unavailable and the API answers 409
      # `vault_managed_externally`.
      #
      # then uncomment this block and the matching `secrets:` grants +
      # `*_FILE` environment entries above. The app reads the *files*; the operator
      # never puts a secret into the environment or the compose file.
      # secrets:
      #   tucano_vault_key:
      #     file: ${TUCANO_SECRETS_DIR:-./secrets}/vault.key
      #   tucano_session_secret:
      #     file: ${TUCANO_SECRETS_DIR:-./secrets}/session.key

volumes:
  tucanotime-data:
