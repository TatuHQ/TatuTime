# Local email testing overlay — NOT for production.
#
#   docker compose -f docker-compose.yml -f docker-compose.email.yml up -d --build
#
# Adds Mailpit, a local SMTP sink with a web inbox, and points TucanoTime at
# it through `TUCANO_SMTP_*`. Every message the app sends (test email, invoice
# copy, reminders) is captured instead of delivered:
#
#   SMTP (from the app): mailpit:1025   (no auth, plaintext — fine on the
#                                        compose network and the app's
#                                        trusted-local-relay mode)
#   Web inbox:           http://127.0.0.1:8025
#
# Values stored in the vault (`smtp.*`, Settings → Email) win over these env
# defaults, so clear the stored SMTP settings if the app still sends elsewhere.
# The base compose file is unchanged; drop this overlay to return to real SMTP.
services:
  tucanotime:
    environment:
      TUCANO_SMTP_HOST: ${TUCANO_SMTP_HOST:-mailpit}
      TUCANO_SMTP_PORT: ${TUCANO_SMTP_PORT:-1025}
      TUCANO_SMTP_FROM: ${TUCANO_SMTP_FROM:-noreply@tucanotime.local}

  mailpit:
    image: axllent/mailpit:v1.31.6
    restart: unless-stopped
    ports:
      # Loopback only: the inbox holds every captured message, including any
      # invitation or invoice copy. Change to 0.0.0.0 only on a trusted LAN.
      - "${TUCANO_HOST_ADDR:-127.0.0.1}:${TUCANO_MAILPIT_UI_PORT:-8025}:8025"
      - "${TUCANO_HOST_ADDR:-127.0.0.1}:${TUCANO_MAILPIT_SMTP_PORT:-1025}:1025"
    # Same hardening stance as the app: read-only rootfs, /tmp for the
    # message store, no capabilities, no privilege escalation.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    user: "1000:1000"
    stop_grace_period: 10s
    environment:
      MP_DATABASE: /tmp/mailpit.db
      MP_MAX_MESSAGES: "5000"
      MP_DISABLE_VERSION_CHECK: "1"