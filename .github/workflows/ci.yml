name: CI

on:
  pull_request: {}
  push:
    branches: [main]

# Least privilege (#263 item 1): the workflow-scoped token is read-only. The
# only job that needs to write anything (publishing to GHCR) grants itself
# `packages: write` at the job level, so every other job's token cannot push.
permissions:
  contents: read

# Cancel superseded runs (#263 item 6): a rapid re-push to the same ref (or a
# new commit on a PR head) makes the previous run moot. Self-hosted runner
# capacity is finite and the queue incident (run 37980161645) showed a stale
# run must not keep holding a runner for hours. One group per ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Fork-PR guard (review A1): these jobs run on SELF-HOSTED runners, where an
# untrusted fork PR means arbitrary code executing on org infra with a live
# token. Same-repo branches and main pushes run normally; a fork contribution
# is verified after a member pushes its branch.

# Self-hosted, as in every other workflow in the organisation: GitHub-hosted
# runners are billing-gated on this account. The lint/test job runs inside the
# same pinned Rust image the Dockerfile builds with, so CI, image and local
# `cargo test` share one toolchain.
#
# Container pins (#263 item 5): `rust:1.98.0-slim-trixie` below and in the
# Dockerfile builder stage mirrors rust-toolchain.toml (channel = "1.98.0");
# bump the three together. Images referenced inside `run:` strings are invisible
# to Dependabot's docker ecosystem (it only sees `image:`/`FROM` fields), so
# they are bumped by hand — see the note in .github/dependabot.yml.
jobs:
  lint-test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    container:
      image: rust:1.98.0-slim-trixie
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Toolchain fetch retry (run 38605399352): rust-toolchain.toml pins
      # channel = "1.98.0" with the rustfmt/clippy components, so the first
      # `cargo` invocation in the checkout makes rustup fetch that channel
      # from static.rust-lang.org. A transient connect timeout there
      # (os error 110) turned a green PR red. Warm the pinned toolchain once
      # through a bounded retry so a flaky fetch is absorbed; a genuinely
      # unavailable toolchain still fails the job -- every attempt errors and
      # the step exits non-zero.
      - name: Ensure pinned Rust toolchain (retry transient fetch failures)
        run: |
          retry() {
            local attempt=1 max=5 delay=5
            until "$@"; do
              if [ "$attempt" -ge "$max" ]; then
                echo "::error title=Transient toolchain fetch failed::$* failed after $max attempts" >&2
                return 1
              fi
              echo "attempt $attempt/$max for '$*' failed; retrying in ${delay}s" >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }
          retry rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        # --locked (215): the committed Cargo.lock must be the resolver's own
        # output; drift fails CI instead of silently diverging from the image.
        run: cargo test --locked --all-targets

  build-image:
    # Fork-PR guard (review A1) plus a main-only guard (#263 item 6, #246
    # decision): the image is only ever published from main, so a non-main push
    # must not spend a self-hosted runner on a full release build. PRs still
    # build (build-only, never pushed) so the Dockerfile stays exercised. The
    # repository is main-only, so `on.push.branches` is `[main]` and the guard
    # only bites if a branch trigger is ever added again.
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) &&
      (github.event_name != 'push' || github.ref == 'refs/heads/main')
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write   # needed to push to ghcr.io (main pushes only, per step `if`)
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The crate version IS the release version (AGENTS.md), so the published
      # image carries it as a tag: `:<version>` pins the release the same way
      # the `v<version>` git tag does. Read it before the metadata step.
      - name: Read crate version
        id: crate
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Log in to GHCR on main pushes; skip on PRs (no token needed for build-only).
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derive tags. The metadata action only ever emits
      # `ghcr.io/<owner>/<repo>:<tag>`; on PRs nothing is pushed (push is
      # main-gated below) so the build is a local check only.
      #   • :latest      (main pushes only)
      #   • :<version>   (main pushes only, the crate version = release version)
      #   • :<short-sha> (computed everywhere, pushed on main pushes only)
      # (#263 item 7: the previous comment claimed PRs get a `tucanotime:<sha>`
      # local tag, which the metadata config never produced.)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.crate.outputs.version }},enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          pull: true
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # /healthz and the GUI footer name the commit the image was built
          # from. The build context has no `.git`, so it must come in here;
          # build.rs shortens the sha to the seven characters the release tag
          # uses (`v<version>+<short-sha>`).
          build-args: |
            TUCANO_BUILD=${{ github.sha }}

  actionlint:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Lint workflows
        run: docker run --rm -v "$PWD:/repo:ro" --workdir /repo rhysd/actionlint:1.7.12 -color

  # GUI contract (#102): the jsdom harness drives the real app against the
  # built binary. Server and harness run in pinned images on the host network
  # so both sides of localhost:8099 are the runner itself.
  gui-test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build server binary
        run: docker run --rm -v "$PWD:/repo" -w /repo rust:1.98.0-slim-trixie cargo build --locked --release

      # Real-browser gate: drives the release binary in a real Firefox through
      # the Marionette wire protocol (gui-test/browser-smoke.py, standard
      # library only — no geckodriver, Playwright or npm package). The pinned
      # containers carry no browser, so this runs as a HOST step: the
      # self-hosted runners execute steps on this host (as root), where
      # /usr/bin/firefox is installed. The preflight FAILS, never skips, when
      # Firefox or python3 is missing, so the gate can never silently no-op.
      - name: Preflight the real-browser gate
        run: |
          missing=""
          command -v firefox >/dev/null 2>&1 || missing="firefox"
          command -v python3 >/dev/null 2>&1 || missing="$missing python3"
          if [ -n "$missing" ]; then
            echo "::error title=Real-browser gate cannot run::missing:$missing — gui-test/browser-smoke.py needs a host Firefox (Marionette) and python3. Install them on the self-hosted runner (apt-get install -y firefox python3) or point TUCANO_FIREFOX at the browser. This gate must not be skipped."
            exit 1
          fi
          echo "TUCANO_FIREFOX=$(command -v firefox)" >> "$GITHUB_ENV"
          python3 --version
          firefox --version

      - name: Run real-browser smoke gate
        timeout-minutes: 10
        run: |
          # Embedded assets first, then the dev-mode path: the second run proves
          # `/_dev/reload.js` is served as a CSP-legal asset and that an edit
          # under web/ reloads the browser by itself.
          python3 gui-test/browser-smoke.py
          python3 gui-test/browser-smoke.py --dev-web-dir

      # Self-hosted runners can overlap PR jobs: a fixed :8099 plus a shared
      # container name let one job's `docker rm -f` kill another's server.
      # One random port + per-run container name per job instead (#143 CI).
      - name: Pick a private port for this job
        run: |
          PORT=$((20000 + RANDOM % 30000))
          echo "TT_PORT=$PORT" >> "$GITHUB_ENV"
          echo "TT_CONTAINER=tt-gui-$PORT" >> "$GITHUB_ENV"

      - name: Serve on the job port (fresh data dir)
        run: |
          docker rm -f "$TT_CONTAINER" 2>/dev/null || true
          docker run -d --name "$TT_CONTAINER" --network host \
            -v "$PWD:/repo:ro" -v /data \
            -e TUCANO_DATA_DIR=/data -e TUCANO_PORT="$TT_PORT" \
            rust:1.98.0-slim-trixie /repo/target/release/tucano-time

      - name: Wait for health
        run: |
          for _ in $(seq 1 60); do
            if curl -sf "http://localhost:$TT_PORT/healthz" >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "server did not become healthy"
          docker logs "$TT_CONTAINER"
          exit 1

      - name: Run jsdom harness
        run: |
          docker run --rm --network host \
            -v "$PWD/gui-test:/gui" -v "$PWD/web:/web:ro" \
            -e TT_GUI_BASE="http://localhost:$TT_PORT" \
            -w /gui node:22-slim \
            bash -c "npm ci --no-audit --no-fund && node contrast.mjs && npm run test:jsdom --silent && node gui.mjs"

      - name: Stop server
        if: always()
        run: docker rm -f "$TT_CONTAINER"

  # Secret scanning (#49): full git history via the pinned gitleaks image. The
  # digest is pinned (matching the sibling project's supply-chain discipline)
  # so a tag re-push cannot silently change the scanner.
  secret-scan:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Gitleaks
        run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --redact

  # Supply-chain (#53): dependency advisories + licenses via cargo-deny (the
  # gate), plus a best-effort CycloneDX SBOM artifact.
  supply-chain:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    container:
      image: rust:1.98.0-slim-trixie
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Versions are pinned (#263 item 4) so the gate is reproducible: an
      # unpinned `cargo install` silently picks up whatever is newest at run
      # time and can flip a green build red (or vice versa) between runs.
      #
      # Toolchain fetch retry (run 38605399352): rust-toolchain.toml pins
      # channel = "1.98.0" with the rustfmt/clippy components, so the first
      # `cargo` invocation below makes rustup fetch that channel from
      # static.rust-lang.org. A transient connect timeout there (os error 110)
      # turned a green PR red. Warm the pinned toolchain through a bounded
      # retry so a flaky fetch is absorbed; a genuinely unavailable toolchain
      # still fails the job -- every attempt errors and the step exits non-zero.
      - name: Install git (advisory-db clone) and cargo-deny
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git
          retry() {
            local attempt=1 max=5 delay=5
            until "$@"; do
              if [ "$attempt" -ge "$max" ]; then
                echo "::error title=Transient toolchain fetch failed::$* failed after $max attempts" >&2
                return 1
              fi
              echo "attempt $attempt/$max for '$*' failed; retrying in ${delay}s" >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }
          retry rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          cargo install --locked cargo-deny --version 0.20.2

      - name: cargo deny check
        run: cargo deny check advisories licenses sources bans

      # (#263 item 4) SBOM generation stays best-effort and must not fail the
      # gate, but a missing artifact must not be silent either: the steps log
      # what they produce and the listing below fails loudly if the directory
      # is empty, while `continue-on-error` keeps the job itself green.
      - name: Generate SBOM (CycloneDX)
        continue-on-error: true
        run: |
          cargo install --locked cargo-cyclonedx --version 0.5.9
          cargo cyclonedx --format json
          ls -l target/cyclonedx

      - name: Upload SBOM
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom
          path: target/cyclonedx/*.cdx.json
