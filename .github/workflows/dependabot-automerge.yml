name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions: {}

jobs:
  classify:
    name: Classify the bump
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    concurrency:
      group: dependabot-automerge-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Use only PR metadata; never check out or execute PR code in this job.
      - name: Read the update type
        id: dependabot
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Label eligible updates
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          UPDATE_TYPE: ${{ steps.dependabot.outputs.update-type }}
        run: |
          set -euo pipefail
          current_head=$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq .headRefOid)
          if [[ "$current_head" != "$HEAD_SHA" ]]; then
            echo "PR head has changed; leaving it to the newer run"
            exit 0
          fi
          case "$UPDATE_TYPE" in
            version-update:semver-patch|version-update:semver-minor|security-update:semver-patch|security-update:semver-minor)
              gh pr edit "$PR" --repo "$REPO" --add-label automerge
              ;;
            *)
              gh pr edit "$PR" --repo "$REPO" --remove-label automerge
              ;;
          esac

      - name: Configure GitHub native auto-merge
        env:
          # A built-in Actions token would suppress the release workflow on merge.
          GH_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          UPDATE_TYPE: ${{ steps.dependabot.outputs.update-type }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::DEPENDABOT_AUTOMERGE_TOKEN is not configured"
            exit 1
          fi
          details=$(gh pr view "$PR" --repo "$REPO" --json id,headRefOid,state,autoMergeRequest)
          if [[ $(jq -r '.headRefOid' <<< "$details") != "$HEAD_SHA" || $(jq -r '.state' <<< "$details") != OPEN ]]; then
            echo "PR has changed or closed; skipping stale event"
            exit 0
          fi
          id=$(jq -er '.id' <<< "$details")
          queued=$(jq -r '.autoMergeRequest != null' <<< "$details")
          case "$UPDATE_TYPE" in
            version-update:semver-patch|version-update:semver-minor|security-update:semver-patch|security-update:semver-minor)
              # The ruleset requires the owner's approval before a bot's pull
              # request can merge. This token belongs to the owner, so record
              # that approval here; CI still gates the merge. A push dismisses
              # the approval and re-runs this job, which approves again.
              approver=$(gh api user --jq .login)
              approved=$(gh api "repos/$REPO/pulls/$PR/reviews" \
                --jq "[.[] | select(.state == \"APPROVED\" and .commit_id == \"$HEAD_SHA\" and .user.login == \"$approver\")] | length")
              if [[ "$approved" == 0 ]]; then
                gh api -X POST "repos/$REPO/pulls/$PR/reviews" \
                  -f event=APPROVE \
                  -f commit_id="$HEAD_SHA" \
                  -f body="Approved by automation for a patch/minor Dependabot bump; CI still gates the merge." >/dev/null
              fi
              if [[ "$queued" == false ]]; then
                # Only enroll; unlike gh pr merge --auto, this cannot fall back to a direct merge call.
                gh api graphql -f id="$id" -f head="$HEAD_SHA" -f query="
                  mutation(\$id: ID!, \$head: GitObjectID!) {
                    enablePullRequestAutoMerge(input: {pullRequestId: \$id, expectedHeadOid: \$head, mergeMethod: MERGE}) {
                      pullRequest { number }
                    }
                  }"
              fi
              ;;
            *)
              if [[ "$queued" == true ]]; then
                gh api graphql -f id="$id" -f query="
                  mutation(\$id: ID!) {
                    disablePullRequestAutoMerge(input: {pullRequestId: \$id}) {
                      pullRequest { number }
                    }
                  }"
              fi
              echo "${UPDATE_TYPE:-unknown}: left for manual merge"
              ;;
          esac
