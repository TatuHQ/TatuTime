# Dependabot version updates for TatuTime.
#
# CI on each PR validates the new pin and a human merges — pins never move
# silently. The Rust toolchain is pinned by rust-toolchain.toml and the
# Dockerfile base images; bump all three together in one intentional PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    groups:
      actions:
        patterns:
          - "*"

  # Known blind spot (#263 item 5): this ecosystem only reads image references
  # in `image:` fields and Dockerfile `FROM` lines. Images pulled inside `run:`
  # strings in .github/workflows/ci.yml — `node:24-slim` (gui-test harness) and
  # `rhysd/actionlint:1.7.12` (workflow lint) — are invisible here and get NO
  # update PRs; bump them by hand when the upstream tags move. The
  # `rust:1.99.1-slim-trixie` images (workflow `container:`/`run:` steps) track
  # rust-toolchain.toml and are covered by the `rust` ignore below; the gitleaks
  # scanner is already digest-pinned in the workflow.
  - package-ecosystem: docker
    directories:
      - "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    ignore:
      # rust:1.99.1 mirrors rust-toolchain.toml and must move with it.
      - dependency-name: "rust"

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies

  # GUI harness (#192): jsdom/sass/vanilla-framework gate CI's gui-test job;
  # without this entry they never received update PRs. The vanilla-framework
  # pin is deliberately locked — it must move with a reviewed vendor rebuild
  # (gui-test/build-ubuntu-assets.mjs + manifest hashes), not an automated bump.
  - package-ecosystem: npm
    directory: /gui-test
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    ignore:
      - dependency-name: "vanilla-framework"
